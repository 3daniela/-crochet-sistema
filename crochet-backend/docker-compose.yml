version: "3.8"

services:
  crochet-api:
    build: .
    container_name: crochet-api
    ports:
      - "8080:8080"
    environment:
      # Datos de conexión a la BD MySQL en Railway (Settings -> Variables)
      MYSQLHOST: ${MYSQLHOST}
      MYSQLPORT: ${MYSQLPORT}
      MYSQLDATABASE: ${MYSQLDATABASE}
      MYSQLUSER: ${MYSQLUSER}
      MYSQLPASSWORD: ${MYSQLPASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    restart: unless-stopped
